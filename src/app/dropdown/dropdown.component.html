<div class="wrapper" [class.long]="menuMaxHeight" [style.min-width]="minWidth">
  <span class="select active" [class.active]="isDropdown" (click)="openDropdown()">{{ selectMessage }}
    <i class="fa fa-caret-down" aria-hidden="true"></i>
  </span>
  <div class="menu" [style.max-height]="menuMaxHeight">
    @if (searchable) {
      <input class="query" type="text" placeholder="Bezeichnung" [value]="query"
        (input)="query = $any($event.target).value" (click)="$event.stopPropagation()" />
    }
    @for (selectItem of getSelectItems(); track selectItem.id) {
      <a [class.disabled]="!selectItems[selectItem.id].value"
        (click)="toggleProperty(selectItem.id)">
        @if (selectItems[selectItem.id].icon) {
          <img height="32" width="28" src="assets/svg-icons/{{ selectItems[selectItem.id].icon }}" />
        }
        {{ selectItem.name }}
      </a>
    }
  </div>
</div>
